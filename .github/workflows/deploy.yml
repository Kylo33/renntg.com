name: Build and Deploy

on:
  push:
    branches: [main]
jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: pnpm/action-setup@v6
      with:
        version: 10
    - run: pnpm install
    - run: pnpm run build
    - uses: actions/upload-artifact@v4
      with:
        name: site-output
        path: dist/
  compile-resume:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: typst-community/setup-typst@v5
    - run: typst compile resume/resume.typ resume/index.pdf
    - uses: actions/upload-artifact@v4
      with:
        name: resume
        path: resume/index.pdf
  deploy:
    needs: [build-site, compile-resume]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v6
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6.1.0
      with:
        aws-region: us-east-1
        role-to-assume: arn:aws:iam::099660946013:role/renntg.com-github-action
    - uses: hashicorp/setup-terraform@v4 
      with:
        terraform_wrapper: true
    - run: terraform -chdir=infra init
    - run: terraform -chdir=infra apply -auto-approve
    - run: echo RESUME_BUCKET_NAME=$(terraform -chdir=infra output -raw resume_bucket_name) >> $GITHUB_ENV
    - run: echo RESUME_BUCKET_REGION=$(terraform -chdir=infra output -raw resume_bucket_region) >> $GITHUB_ENV
    - run: echo WEBSITE_BUCKET_NAME=$(terraform -chdir=infra output -raw website_bucket_name) >> $GITHUB_ENV
    - run: echo WEBSITE_BUCKET_REGION=$(terraform -chdir=infra output -raw website_bucket_region) >> $GITHUB_ENV
    - uses: actions/download-artifact@v4
      with:
        name: site-output
        path: dist/
    - uses: reggionick/s3-deploy@v4
      with:
        folder: dist/
        bucket: ${{ env.WEBSITE_BUCKET_NAME }}
        bucket-region: ${{ env.WEBSITE_BUCKET_REGION }}
        delete-removed: true
        private: true
    - uses: actions/download-artifact@v4
      with:
        name: resume
        path: resume-output/
    - uses: reggionick/s3-deploy@v4
      with:
        folder: resume-output/
        bucket: ${{ env.RESUME_BUCKET_NAME }}
        bucket-region: ${{ env.RESUME_BUCKET_REGION }}
        delete-removed: true
        private: true
